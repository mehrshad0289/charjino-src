      operationId: getRoot
      summary: Web root (outside /api)
      description: '`routes/web.php`. Returns the standard envelope with `{ app, stack, health }`.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          app: { type: string, const: charjino-api }
                          stack: { type: string, const: laravel }
                          health: { type: string, const: /api/health }
  /checkout/validate-player:
    post:
      tags: [Checkout]
      operationId: checkoutValidatePlayer
      summary: Validate game Player ID before payment
      description: '`CheckoutController::validatePlayer`. JWT user. Throttle 10/min. Rejects password/otp/pin/login keys. CODM Activision SKUs run `CodmRegionCheck` first (`validateMode=codm_store` on match). `422` `CODM_REGION_MISMATCH` / `PLAYER_ID_INVALID` block checkout. Until `S2T_KEY` is set, non-CODM may return a dry-run playerName.'
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuId, requirements]
              properties:
                skuId: { type: integer, minimum: 1 }
                requirements:
                  type: object
                  additionalProperties: { type: string }
                  example: { playerId: '5123456789' }
      responses:
        '200':
          description: Player name for customer confirmation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ValidatePlayerResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: '`CODM_REGION_MISMATCH` (data = public region payload) or `PLAYER_ID_INVALID`'
