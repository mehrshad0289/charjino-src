      tags: [Admin · Categories]
      operationId: adminPurgeUnlinkedCategories
      summary: Delete constructed groups that are not linked to a supplier
      description: |
        `AdminCatalogController::purgeUnlinkedGroups`. Detaches products then deletes groups with no `shop2BigCategoryId`
        and no supplier-linked products. Shop2 / FazerCards groups are kept.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Purged
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [deleted, ids]
                        properties:
                          deleted: { type: integer }
                          ids:
                            type: array
                            items: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/catalog/groups/{group}:
