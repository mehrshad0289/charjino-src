      tags: [Coupons]
      operationId: previewCheckoutCoupon
      summary: Preview coupon against server-priced SKU subtotal
      description: JWT shop user. Percentage is capped by maxPercentageAmount. Amount type requires minOrderToman.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, skuId]
              properties:
                code: { type: string, maxLength: 32 }
                skuId: { type: integer, minimum: 1 }
                quantity: { type: integer, minimum: 1, maximum: 100, default: 1 }
                amount: { type: string }
                currency: { type: string }
      responses:
        '200': { description: Quoted discount and payable Toman }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: COUPON_* }
  /orders:
    get:
      tags: [Orders]
      operationId: listMyOrders
      summary: List the authenticated user's orders
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: perPage
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: '{items, meta}'
