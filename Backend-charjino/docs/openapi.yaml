      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                slug: { type: string }
                description: { type: [string, 'null'] }
                imageUrl: { type: [string, 'null'] }
                visible: { type: boolean }
                sortOrder: { type: integer }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
  /admin/catalog/groups/unlinked:
