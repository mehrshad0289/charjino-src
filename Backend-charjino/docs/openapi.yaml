    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create a DRAFT order (price snapshot, Idempotency-Key)
      description: '`OrderController::store`. Header `Idempotency-Key` required. Same key+body returns the same order only while it is still payable; same key different body → 409 `IDEMPOTENCY_CONFLICT`. A new key always opens a new draft so an unpaid previous cart does not block checkout.'
      security: [{bearerAuth: []}]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 80 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuId, requirements]
              properties:
                skuId: { type: integer }
                quantity: { type: integer, minimum: 1, maximum: 100, default: 1 }
                couponCode: { type: string, maxLength: 32, description: 'Optional. Percentage is capped; amount type requires min purchase.' }
                requirements:
                  type: object
                  example: { playerId: '5123456789' }
      responses:
        '200':
          description: Draft order (no costUsd)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CustomerOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
