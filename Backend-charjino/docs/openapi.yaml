      description: '`bootstrap/app.php` → `health: ''/up''`. Framework default HTML page.'
      responses:
        '200':
          description: Application up
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 JWT signed with env `JWT_ACCESS_SECRET` (`app/Support/Jwt.php`). TTL `JWT_ACCESS_TTL` (default 1800 s).
        Claims: `sub` (user UUID), `role` (`admin`|`user`), `phoneNumber`, `email`, `iat`, `exp`.
        Admin routes additionally require `role == "admin"` (`EnsureAdmin`) → otherwise 403.
        Both Next.js apps keep tokens in httpOnly cookies `access_token` / `refresh_token` and call the API server-side only.
  parameters:
    GroupId:
      name: group
      in: path
      required: true
      description: '`catalog_groups.id`'
      schema: { type: integer, minimum: 1 }
    ProductId:
      name: product
      in: path
      required: true
      description: '`products.id` (numeric id, NOT handle)'
      schema: { type: integer, minimum: 1 }
    SkuId:
      name: sku
      in: path
      required: true
      description: '`skus.id`'
      schema: { type: integer, minimum: 1 }
    OrderNumber:
      name: number
      in: path
      required: true
      description: Public order number (`CH…`)
      schema: { type: string, example: CH260926ABCDEF }
    TicketId:
      name: ticket
      in: path
      required: true
      description: Ticket UUID or public number (`TK…`)
      schema: { type: string }
    AdminOrderId:
      name: order
      in: path
      required: true
      description: Order UUID or public number
      schema: { type: string }
  responses:
    Unauthorized:
      description: 'Missing/invalid/expired Bearer token → `احراز هویت نامعتبر است`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, statusCode: 401, message: احراز هویت نامعتبر است, timestamp: '2026-09-25T16:00:00+03:30' }
    Forbidden:
      description: 'Authenticated but JWT role is not admin → `دسترسی مجاز نیست.`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, statusCode: 403, message: دسترسی مجاز نیست., timestamp: '2026-09-25T16:00:00+03:30' }
    BadRequest:
      description: 'Supplier/domain 400 with optional `error.code` (`REGION_MISMATCH`, `CODM_REGION_MISMATCH`, `PLAYER_NOT_FOUND`, `INSUFFICIENT_BALANCE`, …)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: '`مسیر پیدا نشد.` (unknown route or unknown model id), `محصول پیدا نشد.` (public product), or `دسته پیدا نشد.` (public category slug)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: 'Laravel validation failure. Only the FIRST error message is returned (no field map).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, statusCode: 422, message: شماره همراه معتبر نیست., timestamp: '2026-09-25T16:00:00+03:30' }
    TooManyRequests:
      description: 'Route throttle or OTP business limits → `تعداد درخواست بیش از حد مجاز است.` / `تعداد تلاش بیش از حد مجاز است.`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SupplierUnavailable:
      description: 'Shop2TopUp not configured (`کلید تأمین‌کننده تنظیم نشده است.`) or unreachable (`اتصال به تأمین‌کننده برقرار نشد...`). Other supplier errors keep the supplier HTTP status.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServerError:
      description: 'Unhandled exception → `درخواست انجام نشد` (exception message only when APP_DEBUG=true)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, statusCode, data, message, timestamp]
      properties:
        success: { type: boolean, const: true }
        statusCode: { type: integer, example: 200 }
        data: {}
        message: { type: string, description: Persian message (default `موفق`) }
        timestamp: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [success, statusCode, message, timestamp]
      properties:
        success: { type: boolean, const: false }
        statusCode: { type: integer, example: 422 }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        error:
          type: object
          description: Present when the failure has a stable machine code (supplier errors, live-order lock).
          properties:
            code: { type: string, example: IP_NOT_ALLOWED }
    MessageData:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Health:
      type: object
      required: [app, status, language, stack, supplierConfigured, liveOrderEnabled, paymentDriver, database]
      properties:
        app: { type: string, const: charjino-api }
        status: { type: string, const: ok }
        language: { type: string, const: fa }
        stack: { type: string, const: laravel }
        supplierConfigured: { type: boolean, description: 'true if env S2T_KEY is non-empty' }
        liveOrderEnabled: { type: boolean, description: 'env ALLOW_LIVE_ORDER == "yes" (Shop2)' }
        fazercardsConfigured: { type: boolean, description: 'FazerCards API key present' }
        fazercardsLiveOrderEnabled: { type: boolean, description: 'FAZERCARDS_ALLOW_LIVE_ORDER or admin settings' }
        paymentDriver: { type: string, description: 'mock | zibal' }
        database: { type: string, description: 'config database.default, e.g. mysql / sqlite' }
    Policy:
      type: object
      properties:
        language: { type: string, const: fa }
        direction: { type: string, const: rtl }
        neverAskGamePassword: { type: boolean }
        noNetworkBypassTools: { type: boolean }
        noCrypto: { type: boolean }
        noUserToUserTransfer: { type: boolean }
        noCashOut: { type: boolean }
        noOutcomeToPurchasableValue: { type: boolean }
        noChanceBoxWithPurchasableReward: { type: boolean }
        gameOutsideShopMvp: { type: boolean }
        coinFromGameplayDisabled: { type: boolean }
    RequestOtpBody:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber: { type: string, description: 'Iranian mobile; normalized to 09XXXXXXXXX', example: '09123456789' }
    VerifyOtpBody:
      type: object
      required: [phoneNumber, code]
      properties:
        phoneNumber: { type: string, example: '09123456789' }
        code: { type: string, minLength: 4, maxLength: 8, description: 'digits only after normalization', example: '123456' }
    RefreshBody:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 16 }
    AdminLoginBody:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
    AccessTokenOnly:
      type: object
      required: [access_token]
      properties:
        access_token: { type: string }
    ShopAuthUser:
      type: object
      required: [id, phoneNumber, role]
      properties:
        id: { type: string, format: uuid }
        phoneNumber: { type: [string, 'null'], example: '09123456789' }
        name: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
        role: { type: string, const: user }
    AdminAuthUser:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, const: admin }
    ShopSession:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string, description: 'opaque 96-hex-char token; stored hashed; TTL JWT_REFRESH_TTL (default 432000 s = 5 days)' }
        user: { $ref: '#/components/schemas/ShopAuthUser' }
    AdminSession:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        user: { $ref: '#/components/schemas/AdminAuthUser' }
    CatalogStatus:
      type: string
      enum: [active, draft, hidden]
      description: 'products.status / skus.status (validation `in:active,draft,hidden`)'
    Banner:
      type: object
      required: [id, src, title, href, description]
      properties:
        id: { type: integer }
        src: { type: string }
        mediaType: { type: string, enum: [image, gif, video] }
        title: { type: string }
        href: { type: string }
        description: { type: string }
    FlashSaleItem:
      type: object
      description: 'Static rows from `flash_sale_items` (seeded; no admin endpoint manages them). Prices are stored, NOT derived from SKU pricing.'
      required: [id, image, originalPrice, price, productCode, productHandle, productName, productVariantCode, productVariantName]
      properties:
        id: { type: integer }
        image: { type: string }
        originalPrice: { type: integer, description: Toman }
        price: { type: integer, description: Toman }
        productCode: { type: string }
        productHandle: { type: string }
        productName: { type: string }
        productVariantCode: { type: string }
        productVariantName: { type: string }
    PublicProduct:
      type: object
      description: '`Product::toApi()`'
      required: [id, categoryName, code, handle, inputs, isPopular, publisher, subtitle, thumbnail, title, minPrice]
      properties:
        id: { type: integer }
        categoryName: { type: string, description: 'catalog group title if loaded, else products.category_name' }
        code: { type: string }
        handle: { type: string, description: 'URL slug used by /catalog/products/{handle}' }
        inputs:
          type: array
          description: 'Buyer input keys. Seeded products have ["playerId"]; products created by Shop2 sync have [] (sync does not fill it).'
          items: { type: string }
        isPopular: { type: boolean }
        indexable: { type: boolean, description: 'SEO indexable flag. Steam gifts default false except ~500 demand games.' }
        publisher: { type: string, description: 'Public publisher; supplier brands are blank' }
        subtitle: { type: string }
        seoTitle: { type: [string, 'null'], description: 'Optional admin override for document title' }
        seoDescription: { type: [string, 'null'], description: 'Optional admin override for meta description' }
        description: { type: [string, 'null'] }
        thumbnail: { type: string, description: 'image_url || thumbnail || /image/catalog/pubg-mobile.svg' }
        title: { type: string, description: 'Storefront title; generic Direct Topup uses the catalog group name' }
        titleEn: { type: [string, 'null'], description: 'English name for search and SEO' }
        minPrice: { type: [integer, 'null'], description: 'min Toman sell price of active+visible SKUs (USD cost x rate x margin, rounded to 100)' }
        platform: { type: [string, 'null'], description: 'Canonical game-key bucket ea/rockstar/steam/xbox when applicable; otherwise supplier platform' }
        region: { type: [string, 'null'], description: 'Supplier region when a single real region exists. Iran is never a catalog region.' }
        fulfillmentType: { type: [string, 'null'] }
        validateMode: { type: string, enum: [api, manual] }
        identityKind: { type: string, enum: [player, user, account], description: 'player for games, user for Telegram/Discord, account for stores' }
    PublicSku:
      type: object
      description: '`Sku::toApi()` — sell Toman only; never includes supplier costUsd'
      required: [id, code, name, price, fulfillmentType]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        nameEn: { type: [string, 'null'], description: 'English name for search and SEO' }
        price: { type: integer, description: 'Payable Toman; sale price while discount is active' }
        originalPrice: { type: [integer, 'null'], description: 'List price when a sale is active' }
        saleEndsAt: { type: [string, 'null'], format: date-time }
        fulfillmentType: { type: [string, 'null'] }
        region: { type: [string, 'null'] }
        minOrderQuantity: { type: integer, minimum: 1, description: 'Supplier min qty, at least 1' }
        maxOrderQuantity: { type: integer, minimum: 1, maximum: 100, description: 'Supplier max qty, shop-capped at 100' }
        filters:
          type: object
          additionalProperties: { type: string }
          description: 'Facet values for this SKU (`region`/`edition`/`denomination`/`duration`) when the product has packFilters'
    BuyerInputField:
      type: object
      description: '`BuyerInputFields::sanitize` — password/otp/pin/login names are stripped'
      required: [name, label, type, required]
      properties:
        name: { type: string }
        label: { type: string }
        type: { type: string }
        required: { type: boolean }
        options: {}
    ValidatePlayerResult:
      type: object
      description: '`OrderService::validatePlayer` for the shop user'
      required: [playerName, skuId]
      properties:
        playerName: { type: string }
        region: { type: [string, 'null'] }
        zoneId: { type: [string, 'null'] }
        skuId: { type: integer }
        validateMode: { type: string, enum: [api, manual, codm_store] }
        validation: { type: string, enum: [ok, unsupported, skipped, unverified] }
        identityKind: { type: string, enum: [player, user, account] }
        warning: { type: [string, 'null'] }
        unverified: { type: boolean }
        codmRegion:
          type: object
          properties:
            status: { type: string, enum: [match, mismatch, unknown] }
            variantCountry: { type: string }
            nickname: { type: [string, 'null'] }
            shortId: { type: [string, 'null'] }
            accountCountry: { type: [string, 'null'] }
            suggestedVariant: { type: [string, 'null'] }
            suggestedHandle: { type: [string, 'null'] }
            variantHandle: { type: [string, 'null'] }
    CustomerOrder:
      type: object
      description: '`Order::toCustomer()` — no costUsd, no supplier UUID'
      required: [id, number, status, amountToman, quantity, dryRun]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: CH260926ABCDEF }
        status: { type: string, example: fulfilling }
        amountToman: { type: integer, description: Toman payable after coupon }
        subtotalToman: { type: integer, description: Toman before coupon }
        discountToman: { type: integer }
        couponCode: { type: [string, 'null'] }
        quantity: { type: integer }
        playerName: { type: [string, 'null'] }
        playerId: { type: [string, 'null'], description: 'Owner-only Player ID from order requirements' }
        skuName: { type: [string, 'null'] }
        productTitle: { type: [string, 'null'] }
        customerMessage: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: [string, 'null'], format: date-time }
        timeline:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              at: { type: [string, 'null'] }
              status: { type: [string, 'null'] }
        dryRun: { type: boolean, description: 'true when ALLOW_LIVE_ORDER is not yes or this attempt is dry-run' }
        paymentProvider: { type: [string, 'null'] }
        paymentRef: { type: [string, 'null'], description: 'Zibal refNumber after verify' }
        paymentCardMasked: { type: [string, 'null'] }
    PayOrderResult:
      type: object
      required: [redirectUrl, authority, provider, order]
      properties:
        redirectUrl: { type: string }
        authority: { type: string }
        provider: { type: string, example: zibal }
        order: { $ref: '#/components/schemas/CustomerOrder' }
    CustomerOrderPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomerOrder' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    Ticket:
      type: object
      required: [id, number, subject, status]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        subject: { type: string }
        category: { type: string, enum: [order, payment, delivery, account, other] }
        orderNumber: { type: [string, 'null'] }
        status: { type: string, enum: [open, answered, closed] }
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    TicketMessage:
      type: object
      required: [id, sender, body]
      properties:
        id: { type: integer }
        sender: { type: string, enum: [user, staff] }
        body: { type: string }
        createdAt: { type: [string, 'null'], format: date-time }
    TicketDetail:
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          properties:
            messages:
              type: array
              items: { $ref: '#/components/schemas/TicketMessage' }
    TicketPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    PublicProductDetail:
      allOf:
        - $ref: '#/components/schemas/PublicProduct'
        - type: object
          required: [skus, requirements, inputFields]
          properties:
            skus:
              type: array
              items: { $ref: '#/components/schemas/PublicSku' }
            packFilters:
              type: array
              description: 'Family-specific SKU facets for the product page. Empty when fewer than 4 SKUs or a dimension has only one value.'
              items:
                type: object
                required: [key, label, options]
                properties:
                  key: { type: string, enum: [region, edition, denomination, duration] }
                  label: { type: string }
                  options:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: { type: string }
                        label: { type: string }
            requirements:
              type: array
              description: 'products.requirements JSON (never populated by current sync code → usually [])'
              items: {}
            inputFields:
              type: array
              description: 'Sanitized buyer fields for the product form (Formik). Defaults to playerId if empty.'
              items: { $ref: '#/components/schemas/BuyerInputField' }
            category:
              type: [object, 'null']
              required: [id, slug, title]
              properties:
                id: { type: integer }
                slug: { type: string }
                title: { type: string }
                purchaseGuide: { type: [string, 'null'], description: 'Per-category purchase help shown in the product-page modal. Newlines are kept.' }
                purchaseGuideItems:
                  type: array
                  items: {}
            codm:
              type: [object, 'null']
              description: 'CODM version switcher + Activision region-check flags (`CodmCatalog::payload`). Null for non-CODM products.'
              properties:
                hint: { type: string }
                versions:
                  type: array
                  items:
                    type: object
                    required: [handle, label, selected]
                    properties:
                      handle: { type: string }
                      label: { type: string }
                      selected: { type: boolean }
                regionCheck: { type: boolean }
                variantCountry: { type: [string, 'null'] }
                guideHref: { type: [string, 'null'] }
            buyGuide:
              type: [object, 'null']
              description: 'Resolved BuyGuide payload (`BuyGuideResolver`). Drafts are omitted. `legacyItems` is the old group slide guide when no published BuyGuide exists.'
              properties:
                title: { type: string }
                summary: { type: [string, 'null'] }
                introHtml: { type: [string, 'null'] }
                lastReviewedAt: { type: [string, 'null'] }
                scope:
                  type: object
                  properties:
                    category: { type: string }
                    subcategory: { type: [string, 'null'] }
                    productId: { type: integer }
                seo:
                  type: object
                  properties:
                    title: { type: [string, 'null'] }
                    description: { type: [string, 'null'] }
                sections:
                  type: array
                  items: {}
                legacyItems:
                  type: array
                  items: {}
    PublicCategory:
      type: object
      description: '`CatalogGroup::toApi()` — visible groups only'
      required: [id, slug, title, description, imageUrl, productsCount]
      properties:
        id: { type: integer }
        slug: { type: string, example: game-topup }
        title: { type: string }
        titleEn: { type: [string, 'null'], description: 'English name for search and SEO' }
        seoTitle: { type: [string, 'null'] }
        seoDescription: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        purchaseGuide: { type: [string, 'null'], description: 'Admin-managed purchase guide for this category; newlines preserved' }
        imageUrl: { type: [string, 'null'] }
        productsCount: { type: integer, description: 'Count of active+visible products' }
    PageMeta:
      type: object
      required: [page, perPage, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 1 }
        platforms:
          type: array
          items: { type: string }
          description: Distinct supplier platforms in the current result set (paginated catalog/admin lists)
        regions:
          type: array
          items: { type: string }
          description: Distinct supplier regions; Iran is omitted
    PublicCategoryPage:
      type: object
      required: [category, products, meta]
      properties:
        category: { $ref: '#/components/schemas/PublicCategory' }
        products:
          type: array
          items: { $ref: '#/components/schemas/PublicProduct' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    PublicProductPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicProduct' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    HomeGroup:
      type: object
      required: [name, products]
      properties:
        id: { type: [integer, 'null'], description: 'catalog_groups.id; null only in the no-groups fallback' }
        slug: { type: string, description: 'Unique URL slug for GET /catalog/categories/{slug}' }
        name: { type: string, description: 'Storefront group title; generic game-topup label falls back to original name' }
        description: { type: [string, 'null'] }
        imageUrl: { type: [string, 'null'] }
        products:
          type: array
          items: { $ref: '#/components/schemas/PublicProduct' }
    CatalogHome:
      type: object
      required: [banners, flashSale, groups, popular]
      properties:
        banners:
          type: array
          items: { $ref: '#/components/schemas/Banner' }
        flashSale:
          type: array
          items: { $ref: '#/components/schemas/FlashSaleItem' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/HomeGroup' }
        popular:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/PublicProduct' }
        flashSaleTitle: { type: string }
        flashSaleSubtitle: { type: string }
        flashSaleEndsAt: { type: [string, 'null'] }
        popularTitle: { type: string }
        popularSubtitle: { type: string }
    AdminUserRow:
      type: object
      required: [id, name, email, phoneNumber, role, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        phoneNumber: { type: [string, 'null'] }
        role: { type: string, enum: [admin, user] }
        status: { type: string, description: 'default "active"; no other values are set anywhere in code' }
        createdAt: { type: [string, 'null'], format: date-time }
    AdminCategory:
      type: object
      description: '`CatalogGroup::toAdmin()`'
      required: [id, shop2BigCategoryId, name, slug, title, nameEn, description, imageUrl, visible, source, synced, sortOrder, productsCount]
      properties:
        id: { type: integer }
        shop2BigCategoryId: { type: [integer, 'null'] }
        name: { type: string, description: 'supplier (English) name' }
        slug: { type: string, description: 'Public URL slug' }
        title: { type: string, description: 'Persian display title (editable)' }
        nameEn: { type: [string, 'null'], description: 'English name for search and SEO' }
        seoTitle: { type: [string, 'null'] }
        seoDescription: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        purchaseGuide: { type: [string, 'null'], description: 'Purchase-guide modal copy; newlines preserved' }
        imageUrl: { type: [string, 'null'] }
        visible: { type: boolean }
        source: { type: string, enum: [manual, shop2, fazercards] }
        synced: { type: boolean, description: 'true when the group is linked to Shop2 or FazerCards' }
        sortOrder: { type: integer }
        productsCount: { type: integer }
    AdminCategoryUpdateBody:
      type: object
      properties:
        title: { type: string, maxLength: 120 }
        nameEn: { type: [string, 'null'], maxLength: 160 }
        slug: { type: string, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 4000 }
        seoTitle: { type: [string, 'null'], maxLength: 180 }
        seoDescription: { type: [string, 'null'], maxLength: 300 }
        purchaseGuide: { type: [string, 'null'], maxLength: 20000 }
        imageUrl: { type: [string, 'null'], maxLength: 500 }
        visible: { type: boolean }
        sortOrder: { type: integer, minimum: 0 }
    AdminSku:
      type: object
      description: '`Sku::toAdmin()`'
      required: [id, productId, shop2ItemId, code, name, nameEn, fulfillmentType, price, priceManual, salePrice, saleEndsAt, saleActive, sellPrice, costUsd, liveCostUsd, purchaseUsd, purchaseToman, status, visible, sortOrder]
      properties:
        id: { type: integer }
        productId: { type: integer }
        shop2ItemId: { type: [integer, 'null'] }
        code: { type: string }
        name: { type: string }
        nameEn: { type: [string, 'null'], description: 'English name for search and SEO' }
        fulfillmentType: { type: [string, 'null'] }
        price: { type: integer, description: Toman list price }
        priceManual: { type: boolean }
        marginPercent: { type: [string, 'null'], description: 'SKU profit-margin override; null inherits product then global' }
        effectiveMarginPercent: { type: string, description: 'Resolved SKU > product > global margin' }
        marginSource: { type: string, enum: [sku, product, global] }
        salePrice: { type: [integer, 'null'] }
        saleEndsAt: { type: [string, 'null'], format: date-time }
        saleActive: { type: boolean }
        sellPrice: { type: integer, description: 'Current payable Toman (sale when active)' }
        costUsd: { type: [string, 'null'] }
        liveCostUsd: { type: [string, 'null'] }
        purchaseUsd: { type: string, description: 'Live supplier USD, else stored costUsd' }
        purchaseToman: { type: integer, description: 'purchaseUsd × current USD/Toman rate, no sell margin' }
        status: { $ref: '#/components/schemas/CatalogStatus' }
        visible: { type: boolean }
        sortOrder: { type: integer }
        region: { type: [string, 'null'] }
        minOrderQuantity: { type: integer, minimum: 1 }
        maxOrderQuantity: { type: integer, minimum: 1, maximum: 100 }
        giftSkuId: { type: [integer, 'null'], description: 'Gift-card SKU fulfilled instead of this package' }
    AdminSkuUpdateBody:
      type: object
      properties:
        name: { type: string, maxLength: 160 }
        nameEn: { type: [string, 'null'], maxLength: 160 }
        visible: { type: boolean }
        status: { $ref: '#/components/schemas/CatalogStatus' }
        price: { type: integer, minimum: 0, description: Locked sell price Toman (rounded to 1000); sets priceManual }
        marginPercent: { type: [number, 'null'], minimum: 0, maximum: 100, description: 'Profit % for this package; null inherits product/global and unlocks formula pricing' }
        salePrice: { type: [integer, 'null'], minimum: 0 }
        saleEndsAt: { type: [string, 'null'], format: date }
        costUsd: { type: string, description: 'Admin USD price; toman follows the shop rate when price is omitted' }
        giftSkuId: { type: [integer, 'null'] }
    AdminProduct:
      type: object
      description: '`Product::toAdmin()`'
      required: [id, catalogGroupId, shop2CategoryId, shop2BigCategoryId, handle, code, title, nameEn, publisher, categoryName, subtitle, description, thumbnail, imageUrl, displayImage, isPopular, visible, fulfillmentType, status, sortOrder, source, skusCount, skus]
      properties:
        id: { type: integer }
        catalogGroupId: { type: [integer, 'null'] }
        shop2CategoryId: { type: [integer, 'null'] }
        shop2BigCategoryId: { type: [integer, 'null'] }
        fazercardsCategoryId: { type: [string, 'null'] }
        handle: { type: string }
        code: { type: string }
        title: { type: string }
        nameEn: { type: [string, 'null'] }
        publisher: { type: string }
        categoryName: { type: string }
        subtitle: { type: string }
        seoTitle: { type: [string, 'null'] }
        seoDescription: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        thumbnail: { type: string }
        imageUrl: { type: [string, 'null'] }
        displayImage: { type: string }
        isPopular: { type: boolean }
        visible: { type: boolean }
        fulfillmentType: { type: [string, 'null'] }
        giftProxy: { type: boolean, description: 'Listed as itself; each package is fulfilled as a mapped gift card' }
        marginPercent: { type: [string, 'null'], description: 'Product profit-margin override; null inherits global settings' }
        globalMarginPercent: { type: string, description: 'Current shop-wide margin setting' }
        platform: { type: [string, 'null'] }
        region: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/CatalogStatus' }
        sortOrder: { type: integer }
        source: { type: string, enum: [manual, shop2, fazercards] }
        skusCount: { type: integer }
        skus:
          type: array
          description: 'Filled only on GET/PUT /admin/catalog/products/{product}; [] in the list endpoint.'
          items: { $ref: '#/components/schemas/AdminSku' }
    AdminProductUpdateBody:
      type: object
      properties:
        title: { type: string, maxLength: 160 }
        nameEn: { type: [string, 'null'], maxLength: 160, description: 'English name for search and SEO' }
        subtitle: { type: [string, 'null'], maxLength: 160 }
        seoTitle: { type: [string, 'null'], maxLength: 180 }
        seoDescription: { type: [string, 'null'], maxLength: 300 }
        description: { type: [string, 'null'], maxLength: 8000 }
        publisher: { type: [string, 'null'], maxLength: 120 }
        imageUrl: { type: [string, 'null'], maxLength: 500 }
        isPopular: { type: boolean }
        visible: { type: boolean }
        status: { $ref: '#/components/schemas/CatalogStatus' }
        sortOrder: { type: integer, minimum: 0 }
        catalogGroupId: { type: [integer, 'null'] }
        handle: { type: string, maxLength: 120 }
        marginPercent: { type: [number, 'null'], minimum: 0, maximum: 100, description: 'Profit % for all packages without a SKU override' }
        clearSkuMargins: { type: boolean, description: 'Clear per-SKU margin overrides so packages inherit this product (or global)' }
        inputs:
          type: array
          items:
            type: object
    PricingSnapshot:
      type: object
      required: [usdTomanRate, marginPercent, fxMode, fxSource, fxUpdatedAt, sample]
      properties:
        usdTomanRate: { type: string, description: decimal string, example: '100000' }
        marginPercent: { type: string, description: 'decimal string (default "5")', example: '5' }
        fxMode: { type: string, enum: [auto, manual] }
        fxSource: { type: [string, 'null'], description: 'e.g. manual, nobitex-usdtirt, tetherland-usdt' }
        fxUpdatedAt: { type: [string, 'null'], format: date-time }
        sample:
          type: object
          required: [usd, toman]
          properties:
            usd: { type: string, const: '1' }
            toman: { type: integer }
    PricingUpdateBody:
      type: object
      properties:
        usdTomanRate: { type: [number, 'null'], minimum: 0 }
        marginPercent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        fxMode: { type: [string, 'null'], enum: [auto, manual, null] }
    FxRefreshResult:
      allOf:
        - $ref: '#/components/schemas/PricingSnapshot'
        - type: object
          required: [refreshed]
          properties:
            refreshed: { type: boolean }
            repricedSkus: { type: integer }
            reason: { type: string }
    UploadResult:
      type: object
      required: [url, path]
      properties:
        url: { type: string, format: uri, description: 'absolute URL to /storage/{path}' }
        path: { type: string, example: catalog/abc123.png }
    SupplierAccount:
      type: object
      description: '`Shop2Adapter::account()` — no raw supplier payload'
      required: [email, wallet, currency, active]
      properties:
        email: { type: string }
        wallet: { type: string, description: 'USD decimal string' }
        currency: { type: string, const: USD }
        active: { type: boolean }
    SupplierStatus:
      type: object
      required: [configured, liveOrderEnabled, host, seeds]
      properties:
        configured: { type: boolean }
        liveOrderEnabled: { type: boolean }
        host: { type: [string, 'null'], example: shop2topup.com }
        seeds:
          type: array
          items: { type: string }
          example: [SKU_PUBG_UC, SKU_COD_CP]
        skuCount: { type: integer }
        account: { $ref: '#/components/schemas/SupplierAccount' }
        accountError: { type: string, description: 'Persian mapped supplier error' }
        accountErrorCode: { type: string, example: IP_NOT_ALLOWED }
    SkuMap:
      type: object
      properties:
        provider: { type: string, const: shop2topup }
        currency: { type: string, const: USD }
        updatedAt: { type: [string, 'null'] }
        skuCount: { type: integer }
        skus:
          type: array
          items:
            type: object
            properties:
              internal_code: { type: string }
              game: { type: string, enum: [PUBG_MOBILE, COD_MOBILE] }
              product_type: { type: string, enum: [UC, CP] }
              denomination_label: { type: string }
              category_id: { type: integer }
              sub_category_id: { type: integer }
              item_id: { type: integer }
              unit_price_usd: { type: string }
              requirements_schema_ref: { type: string }
              requirement_keys:
                type: array
                items: { type: string }
              test_status: { type: string }
    SyncResult:
      type: object
      required: [account, groups, products, skus, pricing]
      properties:
        status: { type: string, enum: [running, completed, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        durationMs: { type: integer }
        account:
          type: object
          required: [email, wallet]
          properties:
            email: { type: string }
            wallet: { type: string }
            currency: { type: string }
            active: { type: boolean }
        groups: { type: integer }
        products: { type: integer }
        skus: { type: integer }
        pricing: { $ref: '#/components/schemas/PricingSnapshot' }
    CatalogSyncStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [idle, running, completed, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        durationMs: { type: integer }
        groups: { type: integer }
        products: { type: integer }
        skus: { type: integer }
        message: { type: string }
        errorCode: { type: string }
        account:
          type: object
          properties:
            email: { type: string }
            wallet: { type: string }
            currency: { type: string }
            active: { type: boolean }
    AdminDashboardSummary:
      type: object
      required: [ordersToday, revenueTodayToman, pendingFulfillment, failedToday]
      properties:
        ordersToday: { type: integer }
        revenueTodayToman: { type: integer }
        pendingFulfillment: { type: integer }
        failedToday: { type: integer }
        supplierWallet: { type: [string, 'null'] }
        supplierWalletLow: { type: boolean, description: 'true when wallet is not positive or INSUFFICIENT_BALANCE' }
        accountError: { type: [string, 'null'], description: 'Persian mapped supplier error; never includes raw' }
        accountErrorCode: { type: [string, 'null'] }
