      tags: [Admin · Products]
      operationId: adminUpdateSku
      summary: Update a SKU (name, visible, status, margin percent, sell price Toman)
      description: |
        `marginPercent` (0–100, or null to inherit product/global) reprices from USD cost × rate × (1 + margin/100), rounded to 1000 Toman, and clears `priceManual`.
        If `price` is sent it is stored as a locked Toman amount (`priceManual=true`) and FX/margin sync will not change it.
