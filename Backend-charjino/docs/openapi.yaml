  /admin/supplier:
    get:
      tags: [Admin · Supplier (Shop2TopUp)]
      operationId: adminGetSupplierStatus
      summary: Shop2TopUp configuration + account/wallet
      description: |
        `AdminSupplierController::show`. If `S2T_KEY` is set, calls Shop2TopUp `GET /account` through `Shop2Adapter` (no raw supplier payload). Errors include `accountErrorCode` (`IP_NOT_ALLOWED`, `INVALID_API_KEY`, …) while HTTP stays 200.
