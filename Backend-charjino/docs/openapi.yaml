  /payments/verify/zibal:
    get:
      tags: [Payments]
      operationId: paymentVerifyZibalBrowser
      summary: Zibal browser return (302 to shop /payments/zibal)
      description: No JWT. If the Zibal panel callback points here, GET redirects to the shop verify page so login cookies stay same-origin.
      parameters:
        - name: trackId
          in: query
          schema: { type: string }
        - name: success
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: orderId
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Redirect to shop /payments/zibal
    post:
      tags: [Payments]
      operationId: paymentVerifyZibal
      summary: Verify Zibal payment (shop same-origin)
      description: No JWT. Shop `/payments/zibal` POSTs `{trackId, success, status, orderId}`. Accepts Zibal verify result 100 or 201. Idempotent if already paid.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [trackId]
              properties:
                trackId: { type: string }
                success: { type: string }
                status: { type: string }
                orderId: { type: string }
      responses:
        '200':
          description: Payment verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CustomerOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
