        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/supplier/price:
    get:
      tags: [Admin · Supplier (Shop2TopUp)]
      operationId: adminGetLiveSupplierPrice
      summary: Live USD unit price for a supplier item
      description: '`Shop2Adapter::livePrice`. Admin JWT. Query `itemId` or `internalCode` from sku-map.'
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: query
          name: itemId
          schema: { type: integer }
        - in: query
          name: internalCode
          schema: { type: string, example: SKU_PUBG_UC_60 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [itemId, unitPrice, currency]
                        properties:
                          itemId: { type: integer }
                          unitPrice: { type: string }
                          currency: { type: string, const: USD }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/SupplierUnavailable' }
  /admin/supplier/validate-player:
    post:
      tags: [Admin · Supplier (Shop2TopUp)]
      operationId: adminValidatePlayer
      summary: Validate player id against supplier before payment
      description: |
        `Shop2Adapter::validatePlayer`. Admin JWT. Never asks for game password/OTP.
        Stable error codes include `REGION_MISMATCH`, `PLAYER_NOT_FOUND`, `IP_NOT_ALLOWED`.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId]
              properties:
                itemId: { type: integer }
                internalCode: { type: string }
                playerId: { type: string }
                server: { type: string }
                zoneId: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [playerName, itemId]
                        properties:
                          itemId: { type: integer }
                          playerName: { type: string }
                          region: { type: [string, 'null'] }
                          zoneId: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/catalog/sync:
    get:
      tags: [Admin · Supplier (Shop2TopUp)]
      operationId: adminCatalogSyncStatus
      summary: Last catalog sync status (idle/running/completed/failed)
      description: Cached last run. No secrets. `account` is email/wallet/currency/active only.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CatalogSyncStatus' }
    post:
      tags: [Admin · Supplier (Shop2TopUp)]
      operationId: adminSyncCatalog
      summary: Import/refresh categories, products and SKUs from Shop2TopUp
      description: |
        `CatalogSyncService::sync`. Returns `{status, startedAt, finishedAt, durationMs, account, groups, products, skus, pricing}`.
        `account` never includes raw supplier payload. Admin-edited Persian fields are preserved. Then SKUs are re-priced.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Synced (message `کاتالوگ تأمین‌کننده همگام شد.`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SyncResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/SupplierUnavailable' }
  /admin/catalog/groups:
    get:
      tags: [Admin · Categories]
      operationId: adminListCategories
      summary: List categories (catalog groups) with product counts
      description: '`AdminCatalogController::groups`. `source=manual` ساخته‌شده؛ `source=supplier` وصل به Shop2 یا FazerCards. `synced` یعنی دسته دستی نیست.'
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: query
          name: source
          schema: { type: string, enum: [manual, supplier, shop2, fazercards] }
          description: Filter constructed vs supplier-linked groups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
