    get:
      tags: [Payments]
      operationId: paymentCallbackBrowser
      summary: PSP browser return
      description: 'No JWT. `mock` GET verifies then 302 to shop invoice. `zibal` GET 302 to shop `/payments/zibal` (verify happens on the shop POST).'
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [mock, zibal] }
        - name: authority
          in: query
          schema: { type: string }
        - name: trackId
          in: query
          schema: { type: string }
        - name: success
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: orderId
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Redirect to shop invoice or /payments/zibal
    post:
      tags: [Payments]
      operationId: paymentCallback
      summary: PSP callback (mock provider verifies and dispatches fulfill job)
      description: 'No JWT. `mock` verifies then JSON or 302 to shop. `zibal` GET 302 to shop `/payments/zibal`; POST verifies with Zibal.'
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [mock, zibal] }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                authority: { type: string }
                status: { type: string, example: OK }
      responses:
        '200':
          description: Payment verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CustomerOrder' }
  /webhooks/shop2topup:
    post:
      tags: [Webhooks]
      operationId: shop2Webhook
      summary: Shop2TopUp webhook (HMAC on raw body, idempotent)
      description: |
        Verify first: `X-Shop2Topup-Signature: sha256=<hmac-sha256(raw body, S2T_WEBHOOK_SECRET)>` with `hash_equals`.
        Then JSON parse. Events `order.completed`, `order.refunded`, `webhook.test`.
        Unique `(event, supplier_order_id)`. Duplicate → 200. Heavy work queued (`ProcessShop2Webhook`; sync in tests).
      parameters:
        - name: X-Shop2Topup-Signature
          in: header
          required: true
          schema: { type: string, example: sha256=abc }
        - name: X-Shop2Topup-Event
          in: header
          required: true
          schema: { type: string, example: order.completed }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string }
                order_id: { type: string, format: uuid }
                status: { type: string }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Invalid HMAC
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
