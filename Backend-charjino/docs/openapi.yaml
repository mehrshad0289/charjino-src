      description: '`?category=` id or slug, `status`, `q`, `visible`, `source`, `platform`, `region`, `page`, `perPage`. Returns `{items, meta}` with `platforms`/`regions` facets. Game-key `meta.platforms` lists every Fazer platform string present in the current result (PlayStation included), not a fixed four-name list.'
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: visible
          schema: { type: string }
        - in: query
          name: source
          schema: { type: string, enum: [manual, supplier, shop2, fazercards] }
        - in: query
          name: platform
          schema: { type: string }
        - in: query
          name: region
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: perPage
          schema: { type: integer, default: 20, maximum: 100 }
