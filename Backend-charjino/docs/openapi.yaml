      operationId: adminUpdateCategory
      summary: Update a category (partial)
      description: '`AdminCatalogController::updateGroup`. Route-model binding by numeric id; unknown id → 404 `مسیر پیدا نشد.`. Message `دسته ذخیره شد.`'
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCategoryUpdateBody' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin · Categories]
      operationId: adminDeleteCategory
      summary: Delete empty manual group; hide synced groups; 409 if products exist
      description: Synced Shop2 groups are never hard-deleted (`visible=false`). Manual groups with products return 409 `CATEGORY_HAS_PRODUCTS`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
