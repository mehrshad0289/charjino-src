openapi: 3.1.0
info:
  title: Charjino (شارژینو) Store Backend API
  version: 0.1.7-as-built-2026-09-26
  summary: As-built contract of Backend-charjino (Laravel 12), derived strictly from source code.
  description: |
    **This document describes ONLY what exists in the code of `Backend-charjino` as of 2026-09-26 (Asia/Tehran).**
    Nothing here is proposed. Remaining proposals live in `PROPOSED-standard.md`.

    Source of truth:
    - Routes: `Backend-charjino/routes/api.php` (prefix `/api`, set in `bootstrap/app.php` → `apiPrefix: 'api'`), `routes/web.php`
    - Envelope: `app/Support/ApiResponse.php`
    - Error rendering: `bootstrap/app.php` (`withExceptions`)
    - Auth: `app/Http/Middleware/AuthenticateJwt.php`, `app/Http/Middleware/EnsureAdmin.php`, `app/Support/Jwt.php`, `app/Modules/Identity/IdentityService.php`

    ### Response envelope
    Every `/api/*` response (success or error) is JSON:
    - success: `{ success: true, statusCode, data, message, timestamp }`
    - error:   `{ success: false, statusCode, message, timestamp }` (no `data`, no per-field error map — validation returns only the FIRST message)

    `message` is Persian. If `data` is an object that contains a non-empty string `message`, that value is also copied to the top-level `message`.

    ### Money
    - `price`, `minPrice`, `originalPrice`: integer **Toman** (تومان), computed server-side. Sell price = `costUsd × usdTomanRate × (1 + margin/100)`, rounded to the nearest 1000 (`PricingService::sellToman`). Margin is SKU override, else product override, else global `margin_percent`. `priceManual` SKUs stay frozen in Toman.
    - `costUsd`, `liveCostUsd`, `usdTomanRate`, `marginPercent`, `wallet`: **decimal strings** (never floats). Public `Sku::toApi()` never includes `costUsd` — shop customers see sell Toman only.

    ### Pagination
    Public catalog: `GET /catalog/categories/{slug}` always returns `{category, products, meta}`.
    `GET /catalog/products` stays a **bare array** unless `page`, `perPage` or `category` is set — then `data` is `{items, meta}`.
    `meta` = `{page, perPage, total, totalPages}` (`page` default 1, `perPage` default 20, max 100).
    Admin catalog products and admin orders return `{items, meta}` (`page` default 1, `perPage` default 20, max 100). Admin groups remain `{items: [...]}`.

    ### Orders / payments
    Implemented under `/api` (not `/api/v1`): validate-player → `POST /orders` (`draft`) → `POST /orders/{number}/pay` (`pending_payment`) → mock PSP `POST /payments/callback/mock` (`paid`) → worker persists supplier UUID then `fulfilling`. Live Shop2 `orders/create` stays locked unless `ALLOW_LIVE_ORDER=yes`. Until then fulfillment is dry-run (`fulfillment_attempts.dry_run=true`). Webhook `POST /webhooks/shop2topup` verifies HMAC-SHA256 on the **raw body**. Poll command `charjino:poll-fulfillment` caps Shop2 `GET /orders/:id` at 3/60s per UUID.
  contact:
    name: Charjino
    url: https://charjino.ir
  license:
    name: MIT (as declared in Backend-charjino/composer.json)
    identifier: MIT
servers:
  - url: http://127.0.0.1:3000/api
    description: Local dev (`php artisan serve --port=3000`; composer script `dev`/`serve`; `.env.example` PORT=3000)
  - url: https://api.charjino.ir/api
    description: Production (deploy/charjino/nginx/api.conf, deploy/charjino/env/*.env.example)
tags:
  - name: System
    description: Health, policy and non-/api web routes.
  - name: Auth
    description: Shop users log in with phone OTP; admins log in with email/password. Stateless HS256 JWT access token + opaque refresh token.
  - name: Catalog (public)
    description: Public storefront catalog. No auth. Only products with `status=active` AND `visible=true` are returned.
  - name: Admin · Users
    description: Requires Bearer access token whose JWT `role` claim is `admin`.
  - name: Admin · Categories
    description: Catalog groups. Manual create (`shop2BigCategoryId` null). Synced Shop2 groups hide on DELETE (`visible=false`); empty manual groups hard-delete; groups with products return 409.
  - name: Admin · Products
    description: Products and SKUs. List supports `category`/`status`/`q`/`page`. DELETE hides (`status=hidden`). SKU `price` is sell Toman (rounded to 100).
  - name: Admin · Pricing
    description: USD→Toman rate and margin settings; changing them re-prices every SKU.
  - name: Admin · Uploads
    description: Image upload to the `public` disk (served by `GET /storage/{path}`).
  - name: Admin · Supplier (Shop2TopUp)
    description: Supplier status and catalog sync. Calls Shop2TopUp server-to-server; the supplier only accepts calls from allow-listed server IPs.
  - name: Checkout
    description: Authenticated shop user. Player ID only (no game password/OTP/PIN).
  - name: Orders
    description: Authenticated shop user. Idempotency-Key required on create.
  - name: Payments
    description: Mock PSP callback (non-production). No JWT.
  - name: Webhooks
    description: Shop2TopUp HMAC webhook. No JWT.
  - name: Tickets
    description: Authenticated shop user. Statuses open / answered / closed.
  - name: Favorites
    description: Authenticated shop user. Unique (user, product).
  - name: Admin · Tickets
    description: Admin JWT. Reply as staff and close tickets.
  - name: Admin · Orders
    description: Admin JWT. Includes cost snapshot and supplier UUID; still no API keys.
  - name: Admin · Buy guides
    description: Manage hierarchical buy guides (category / subcategory / product) with WebP media and storefront revalidate.
  - name: Blog (public)
    description: Published shop blog. Optional Bearer on GET for liked flags. No Fazer/supplier calls.
  - name: Blog (shop)
    description: Authenticated shop user. Comment, reply (one level), like on post/comment.
  - name: Admin · Blog
    description: Admin JWT. Categories and post library (draft/publish). Comment hide.
  - name: Catalog (shop comments)
    description: Authenticated shop user. Product comment, one-level reply, like. Same rules as blog comments.
  - name: Admin · Catalog comments
    description: Admin JWT. Hide or restore product comments.
  - name: Coupons
    description: Shop coupon preview and apply at order create. Percentage has a Toman cap; amount type requires min purchase.
security: []
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Health check
      description: '`HealthController` (routes/api.php). Public.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Health' }
              example:
                success: true
                statusCode: 200
                data: { app: charjino-api, status: ok, language: fa, stack: laravel, supplierConfigured: false, liveOrderEnabled: false, database: mysql }
                message: موفق
                timestamp: '2026-09-25T16:00:00+03:30'
        '500': { $ref: '#/components/responses/ServerError' }
  /platform/policy:
    get:
      tags: [System]
      operationId: getPlatformPolicy
      summary: Product policy flags
      description: 'Returns `config(''charjino.policy'')` (config/charjino.php). Public.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Policy' }
  /auth/request-otp:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: Request a login OTP for a shop user (phone)
      description: |
        `AuthController::requestOtp` → `IdentityService::requestOtp`. Validation: `app/Http/Requests/RequestOtpRequest.php`.
        - `phoneNumber` is normalized first (Persian/Arabic digits, `+98`/`0098`/`98` prefixes) and must then match `^09\d{9}$`.
        - Route throttle: `throttle:10,10` (10 requests / 10 min).
        - Business rate limit: max 5 OTP requests per phone per 600 s (config `charjino.otp.rate_max`, `rate_window_seconds`) → 429.
        - OTP TTL 120 s. In non-production with `DEV_OTP_CODE` set, the code is that fixed value and is written to the log (masked phone).
        - No SMS provider integration exists in code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestOtpBody' }
            example: { phoneNumber: '09123456789' }
      responses:
        '200':
          description: OTP issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MessageData' }
              example: { success: true, statusCode: 200, data: { message: کد تأیید ارسال شد. }, message: کد تأیید ارسال شد., timestamp: '2026-09-25T16:00:00+03:30' }
        '400':
          description: '`DEV_OTP_CODE نامعتبر است.` (misconfigured DEV_OTP_CODE)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/verify-otp:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Verify OTP and open a shop-user session
      description: |
        `IdentityService::verifyOtp`. Validation: `VerifyOtpRequest.php` (`code` → digits only, 4–8 chars).
        Creates the user (role `user`, status `active`) on first login. Max 5 attempts per challenge.
        Throttle `throttle:20,10`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpBody' }
            example: { phoneNumber: '09123456789', code: '123456' }
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ShopSession' }
        '401':
          description: '`کد تأیید نامعتبر است.` or `کد تأیید منقضی شده است.`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      summary: Exchange a refresh token for a new access token
      description: |
        `IdentityService::refresh`. Returns ONLY a new `access_token`; the refresh token is NOT rotated.
        Validation: `RefreshTokenRequest.php`. No throttle.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshBody' }
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AccessTokenOnly' }
        '401':
          description: '`توکن بازیابی موجود نیست` (unknown, revoked or expired refresh token)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/admin/login:
    post:
      tags: [Auth]
      operationId: adminLogin
      summary: Admin login (email + password)
      description: |
        `IdentityService::adminLogin`. Only users with `role=admin` can log in. Email is lower-cased and trimmed.
        Admin user is created by `database/seeders/AdminSeeder.php` from env `ADMIN_EMAIL`/`ADMIN_PASSWORD`/`ADMIN_NAME`.
        Throttle `throttle:10,10`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLoginBody' }
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminSession' }
        '401':
          description: '`ایمیل یا رمز عبور نادرست است.`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Logout (revokes ALL refresh tokens of the user)
      description: '`IdentityService::logout` sets `revoked_at` on every refresh token of the user (all devices). The access token itself stays valid until `exp`.'
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MessageData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current user
      description: '`User::toAuthUser()` — shape depends on role.'
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/ShopAuthUser'
                          - $ref: '#/components/schemas/AdminAuthUser'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/profile:
    patch:
      tags: [Auth]
      operationId: updateShopProfile
      summary: Update shop display name
      description: '`IdentityService::updateProfile` — `{ name }` only. No national ID or address. Shop JWT required.'
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 40 }
      responses:
        '200':
          description: Updated shop user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ShopAuthUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /catalog/home:
    get:
      tags: [Catalog (public)]
      operationId: getCatalogHome
      summary: Storefront home payload (banners, flash sale, categories with products, popular)
      description: |
        `CatalogService::home`. `groups` = visible `catalog_groups` (ordered by `sort_order`, `id`), each with `id`, `slug`, `name` (title), and its active+visible products; empty groups are dropped.
        If there are NO catalog_groups at all, products are grouped by their `category_name` instead (`id` is null; `slug` is derived).
        `popular` = first 8 products with `is_popular=true`. Products in a hidden group are omitted.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CatalogHome' }
  /catalog/categories:
    get:
      tags: [Catalog (public)]
      operationId: listCatalogCategories
      summary: Visible catalog groups (id, slug, title)
      description: '`CatalogService::categories`. Only `visible=true`, ordered by `sort_order`, `id`. Products in hidden groups are not counted.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PublicCategory' }
  /catalog/categories/{slug}:
    get:
      tags: [Catalog (public)]
      operationId: getCatalogCategory
      summary: Category page by slug (visible only)
      description: |
        `CatalogService::category`. 404 `دسته پیدا نشد.` if missing or hidden.
        `products` are active+visible storefront products in that group. Query `page` (default 1) and `perPage` (default 20, max 100).
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
          example: game-topup
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: perPage
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicCategoryPage' }
        '404': { $ref: '#/components/responses/NotFound' }
  /catalog/products:
    get:
      tags: [Catalog (public)]
      operationId: listCatalogProducts
      summary: Active & visible products (search, category, pagination)
      description: |
        `CatalogService::products`. Products whose catalog group is hidden are omitted.
        Query `q` searches title/subtitle/publisher/handle/code/name_en/category_name (max 20 rows when not paginated).
        Query `popular=1` limits to `is_popular` (max 8 unless paginated / filtered by category).
        Query `category` is a catalog group **slug**.
        Query `platform` / `region` match supplier catalog values (case-insensitive). `Iran`/`IR` are not catalog regions and are ignored.
        Game-key `platform` is whatever Fazer returns on `GET /gamekeys` (free string, not a fixed enum): PlayStation, Steam, Xbox, Nintendo, EA, Epic, and any other value are each their own bucket. Known aliases collapse (`PS5` → `playstation`). Empty platform with `appid` is Steam, because Fazer documents `appid` as Steam. No default platform. Category `game-keys` `meta.platforms` lists only buckets that exist in the current catalog.
        Query `minPrice` / `maxPrice` filter by payable Toman.
        Query `indexable=1` keeps products whose SEO `indexable` flag is true (used by the gift sitemap). Storefront listing omits this filter so every product URL still opens.
        If `page`, `perPage` or `category` is present, `data` is `{items, meta}`; otherwise `data` is a bare array (keeps header search working).
        Paginated `meta` also includes `platforms` and `regions` facet lists from the current result set.
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Text search
        - in: query
          name: popular
          schema: { type: boolean }
          description: Only popular products
        - in: query
          name: category
          schema: { type: string }
          description: Catalog group slug (e.g. game-topup)
          example: game-topup
        - in: query
          name: platform
          schema: { type: string }
          description: Game-key bucket `ea`/`rockstar`/`steam`/`xbox`, or other supplier platform. No default. Iran is not used.
        - in: query
          name: region
          schema: { type: string }
          description: Supplier region. Iran is not a catalog region.
        - in: query
          name: minPrice
          schema: { type: integer, minimum: 1 }
          description: Minimum payable Toman
        - in: query
          name: maxPrice
          schema: { type: integer, minimum: 1 }
          description: Maximum payable Toman
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: perPage
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: indexable
          schema: { type: boolean }
          description: When set, filter by the product SEO indexable flag. Omitted on the public shop listing.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - type: array
                            items: { $ref: '#/components/schemas/PublicProduct' }
                          - $ref: '#/components/schemas/PublicProductPage'
  /catalog/products/{handle}/prices:
    get:
      tags: [Catalog (public)]
      operationId: getCatalogProductPrices
      summary: Live sell prices for a product (no ISR payload)
      description: '`CatalogService::productPrices`. Toman prices only. Intended for client refresh of ISR product HTML.'
      parameters:
        - name: handle
          in: path
          required: true
          schema: { type: string }
          example: pubg-mobile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [minPrice, skus]
                        properties:
                          minPrice: { type: [integer, 'null'] }
                          skus:
                            type: array
                            items:
                              type: object
                              required: [id, code, price]
                              properties:
                                id: { type: integer }
                                code: { type: string }
                                price: { type: integer }
                                originalPrice: { type: [integer, 'null'] }
                                saleEndsAt: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }
  /catalog/products/{handle}:
    get:
      tags: [Catalog (public)]
      operationId: getCatalogProduct
      summary: Product detail by handle (slug) or product code
      description: '`CatalogService::product`. Matches `handle` or `code` case-insensitively. Includes `category{id,slug,title}` when the product belongs to a visible group. 404 `محصول پیدا نشد.` if missing, not active, not visible, or its group is hidden.'
      parameters:
        - name: handle
          in: path
          required: true
          schema: { type: string }
          example: pubg-mobile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/users:
    get:
      tags: [Admin · Users]
      operationId: adminListUsers
      summary: List all users (newest first, no pagination)
      description: '`AdminUserController::index`. Read-only; no user create/update/delete endpoints exist.'
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/AdminUserRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/settings:
    get:
      tags: [Admin · Pricing]
      operationId: adminGetPricing
      summary: Pricing snapshot (rate, margin, fx mode)
      description: '`AdminSettingsController::show` → `PricingService::snapshot`.'
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PricingSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin · Pricing]
      operationId: adminUpdatePricing
      summary: Update rate/margin/fx mode and re-price ALL SKUs
      description: |
        `AdminSettingsController::update`. Sending `usdTomanRate` stores it with source `manual` and sets `fx_mode` to `fxMode ?? 'manual'`.
        After saving, `PricingService::repriceAllSkus()` runs synchronously. Message: `تنظیمات قیمت ذخیره شد.`
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PricingUpdateBody' }
            example: { usdTomanRate: 100000, marginPercent: 5, fxMode: manual }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PricingSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/settings/fx:
    post:
      tags: [Admin · Pricing]
      operationId: adminRefreshFx
      summary: Fetch live USD→Toman rate and re-price all SKUs
      description: |
        `AdminSettingsController::refreshFx` first sets `fx_mode=auto`, then `FxRateService::refresh()`:
        tries Nobitex `USDTIRT` orderbook (rial ÷ 10), then Tetherland; falls back to the stored rate; if none → 503.
        Also scheduled daily at 09:10 via `charjino:refresh-fx` (routes/console.php).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FxRefreshResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: '`گرفتن نرخ دلار انجام نشد. نرخ را دستی در پنل وارد کن.`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
